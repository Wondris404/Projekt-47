name: Windows updater tests

on:
  pull_request:
    paths:
      - 'tools/update-windows.ps1'
      - 'tools/tests/update-windows.tests.ps1'
      - '.github/workflows/windows-updater-tests.yml'
  push:
    branches: [main]
    paths:
      - 'tools/update-windows.ps1'
      - 'tools/tests/update-windows.tests.ps1'
      - '.github/workflows/windows-updater-tests.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  powershell-updater:
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Run isolated installer/updater integration tests
        shell: pwsh
        run: ./tools/tests/update-windows.tests.ps1
