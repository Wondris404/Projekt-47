name: Windows demo package

on:
  pull_request:
    paths:
      - 'export_presets.cfg'
      - '.github/workflows/windows-demo.yml'
      - 'scripts/**'
      - 'assets/**'
      - 'data/**'
      - 'scenes/**'
      - 'ui/**'
      - 'project.godot'
  push:
    branches: [main]
    paths:
      - 'export_presets.cfg'
      - '.github/workflows/windows-demo.yml'
      - 'scripts/**'
      - 'assets/**'
      - 'data/**'
      - 'scenes/**'
      - 'ui/**'
      - 'project.godot'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows-demo:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Download and verify Godot and export templates
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $version = '4.7.2'
          $base = "https://github.com/godotengine/godot/releases/download/$version-stable"
          $godotZip = Join-Path $env:RUNNER_TEMP 'godot.zip'
          $templatesZip = Join-Path $env:RUNNER_TEMP 'templates.zip'
          Invoke-WebRequest "$base/Godot_v$version-stable_win64.exe.zip" -OutFile $godotZip
          Invoke-WebRequest "$base/Godot_v$version-stable_export_templates.tpz" -OutFile $templatesZip
          if ((Get-FileHash $godotZip -Algorithm SHA256).Hash -ne '731980f9608d61333e5baf54a2ef17210acc7a538446c0cb9969f002aca1e953') { throw 'Godot checksum mismatch' }
          if ((Get-FileHash $templatesZip -Algorithm SHA256).Hash -ne 'f298490b8d44d934be425a5a65a51bf15f422428b229a06a6e11d9ffea248011') { throw 'Templates checksum mismatch' }
          Expand-Archive $godotZip -DestinationPath (Join-Path $env:RUNNER_TEMP 'godot')
          Expand-Archive $templatesZip -DestinationPath (Join-Path $env:RUNNER_TEMP 'templates')
          $env:APPDATA = Join-Path $env:RUNNER_TEMP 'isolated-appdata'
          $templateDir = Join-Path $env:APPDATA 'Godot/export_templates/4.7.2.stable'
          New-Item -ItemType Directory -Force -Path $templateDir | Out-Null
          Copy-Item (Join-Path $env:RUNNER_TEMP 'templates/templates/*') $templateDir -Recurse
          "APPDATA=$env:APPDATA" >> $env:GITHUB_ENV
          "GODOT_EXE=$env:RUNNER_TEMP/godot/Godot_v4.7.2-stable_win64_console.exe" >> $env:GITHUB_ENV
      - name: Import and export
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          & $env:GODOT_EXE --headless --editor --path . --import
          if ($LASTEXITCODE -ne 0) { throw 'Import failed' }
          New-Item -ItemType Directory -Force -Path build | Out-Null
          & $env:GODOT_EXE --headless --path . --export-release Windows build/Projekt-47.exe
          if ($LASTEXITCODE -ne 0 -or !(Test-Path build/Projekt-47.exe)) { throw 'Export failed' }
      - name: Verify exported game in isolated data directory
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $console = 'build/Projekt-47.console.exe'
          if (!(Test-Path $console)) { throw 'Console wrapper missing' }
          & $console --headless -- profile_sim 2>&1 | Tee-Object -FilePath "$env:RUNNER_TEMP/export-smoke.log"
          if ($LASTEXITCODE -ne 0) { throw 'Exported game returned an error' }
          if (!(Select-String -Path "$env:RUNNER_TEMP/export-smoke.log" -Pattern '^P47_PHASE_DONE .*days=10')) { throw 'Exported simulation did not complete' }
          if (Select-String -Path "$env:RUNNER_TEMP/export-smoke.log" -Pattern '^SCRIPT ERROR:') { throw 'Exported game reported a script error' }
      - name: Prepare package
        shell: pwsh
        run: |
          @'
          Projekt-47 – skúšobná verzia pre Windows 10/11 (64-bit).
          Rozbaľte všetky súbory a spustite Projekt-47.exe.
          Hra ukladá pozície do priečinka používateľských dát Godotu.
          Ide o skúšobnú verziu; chyby a kroky na ich zopakovanie nahláste autorovi.
          '@ | Set-Content -Encoding utf8 build/CITAJ-MA.txt
      - uses: actions/upload-artifact@v4
        with:
          name: Projekt-47-Windows
          path: |
            build/Projekt-47.exe
            build/CITAJ-MA.txt
          if-no-files-found: error
          retention-days: 30

  publish-demo:
    if: github.ref == 'refs/heads/main' && (github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && github.event.before == '9a5f991575229638017232eecd9f1d6a11f814c8' && github.event.head_commit.message == 'Spustit prve testovacie vydanie Windows'))
    needs: windows-demo
    runs-on: windows-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: Projekt-47-Windows
          path: release-input
      - name: Build verified release package
        shell: pwsh
        run: ./tools/package-windows-release.ps1 -InputPath release-input -OutputPath release-output
      - name: Publish prerelease
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference = 'Stop'
          $tag = "demo-$env:GITHUB_RUN_ID-$env:GITHUB_RUN_ATTEMPT"
          gh release create $tag release-output/Projekt-47-Windows.zip release-output/SHA256SUMS.txt --repo $env:GITHUB_REPOSITORY --target $env:GITHUB_SHA --prerelease --latest=false --title "Projekt-47 - testovacia verzia $tag" --notes "Experimentálna testovacia verzia. Obsah a výkon sú vo vývoji."
          if ($LASTEXITCODE -ne 0) { throw 'Release publication failed.' }
